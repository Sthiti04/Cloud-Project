apiVersion: v1
kind: ConfigMap
metadata:
  name: s23-environment
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
data:
{{ toYaml .Values.environment | indent 2 }}
{{- range .Values.services }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    eks.amazonaws.com/role-arn: {{ index $.Values.roleArns .name | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
{{- if not .critical }}
  replicas: {{ .replicas }}
{{- end }}
  selector: {matchLabels: {app: {{ .name }}}}
  template:
    metadata:
      labels: {app: {{ .name }}}
      annotations:
        checksum/environment: {{ toYaml $.Values.environment | sha256sum | quote }}
        checksum/iam-role: {{ index $.Values.roleArns .name | default "" | sha256sum | quote }}
    spec:
      serviceAccountName: {{ .name }}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: {{ .name }}
          image: {{ $.Values.image | quote }}
          imagePullPolicy: IfNotPresent
          envFrom: [{configMapRef: {name: s23-environment}}]
          env: [{name: SERVICE, value: {{ .name | quote }}}]
          ports:
            - {name: http, containerPort: 8080}
{{- if eq .name "device-registry" }}
            - {name: grpc, containerPort: 50051}
{{- end }}
          resources:
            requests: {cpu: {{ ternary "10m" "50m" .critical | quote }}, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            initialDelaySeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: temporary, mountPath: /tmp}]
      volumes: [{name: temporary, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  labels: {app: {{ .name }}, monitor: s23}
spec:
  selector: {app: {{ .name }}}
{{- if eq .name "vital-ingestion" }}
  type: NodePort
{{- end }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if eq .name "vital-ingestion" }}
      nodePort: 30080
{{- end }}
{{- if eq .name "device-registry" }}
    - {name: grpc, port: 50051, targetPort: grpc}
{{- end }}
{{- if .critical }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .name }}
  # An HPA cannot become healthy before its wave-1 Deployment exists.
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ .name }}}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
  behavior:
    scaleUp: {stabilizationWindowSeconds: 30}
    scaleDown: {stabilizationWindowSeconds: 300}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata: {name: device-registry-grpc}
spec:
  clusterIP: None
  selector: {app: device-registry}
  ports:
    - {name: grpc, port: 50051, targetPort: grpc}
