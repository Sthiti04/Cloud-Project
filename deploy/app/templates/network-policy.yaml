apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: internal-services}
spec:
  podSelector:
    matchExpressions: [{key: app, operator: NotIn, values: [zookeeper]}]
  ingress:
    - from: [{podSelector: {}}]
      ports: [{protocol: TCP, port: 8080}, {protocol: TCP, port: 50051}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: public-ingestion-via-alb}
spec:
  podSelector: {matchLabels: {app: vital-ingestion}}
  ingress:
    - from: [{ipBlock: {cidr: 10.23.0.0/16}}]
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: application-zookeeper}
spec:
  podSelector: {matchLabels: {app: zookeeper}}
  ingress:
    - from: [{podSelector: {matchLabels: {app: alert-queue-manager}}}]
      ports: [{protocol: TCP, port: 2181}]
    - from: [{podSelector: {matchLabels: {app: zookeeper}}}]
      ports: [{protocol: TCP, port: 2888}, {protocol: TCP, port: 3888}]
