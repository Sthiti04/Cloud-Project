apiVersion: v1
kind: Service
metadata: {name: zookeeper}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: zookeeper}
  ports:
    - {name: client, port: 2181}
    - {name: peer, port: 2888}
    - {name: election, port: 3888}
{{- range $index, $volume := .Values.zookeeper.volumes }}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $.Values.project }}-zookeeper-{{ $index }}
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  capacity: {storage: 2Gi}
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: ebs.csi.aws.com
    volumeHandle: {{ $volume.id | quote }}
    fsType: ext4
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: topology.kubernetes.io/zone, operator: In, values: [{{ $volume.zone | quote }}]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-zookeeper-{{ $index }}
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: {{ $.Values.project }}-zookeeper-{{ $index }}
  resources: {requests: {storage: 2Gi}}
{{- end }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: zookeeper}
spec:
  serviceName: zookeeper
  replicas: 3
  podManagementPolicy: Parallel
  selector: {matchLabels: {app: zookeeper}}
  template:
    metadata: {labels: {app: zookeeper}}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 1000}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector: {matchLabels: {app: zookeeper}}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: zookeeper
          image: {{ .Values.zookeeper.image | quote }}
          command:
            - bash
            - -ec
            - |
              export ZOO_MY_ID=$((${HOSTNAME##*-} + 1))
              exec /docker-entrypoint.sh zkServer.sh start-foreground
          env:
            - {name: JVMFLAGS, value: "-Xms128m -Xmx256m"}
            - {name: ZOO_4LW_COMMANDS_WHITELIST, value: "ruok,srvr,mntr"}
            - name: ZOO_SERVERS
              value: "server.1=zookeeper-0.zookeeper:2888:3888;2181 server.2=zookeeper-1.zookeeper:2888:3888;2181 server.3=zookeeper-2.zookeeper:2888:3888;2181"
          ports:
            - {name: client, containerPort: 2181}
            - {name: peer, containerPort: 2888}
            - {name: election, containerPort: 3888}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            exec:
              command: ["bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/2181; echo srvr >&3; cat <&3 | grep -E 'Mode: (leader|follower)'"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: client}
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: data, mountPath: /datalog}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: ""
        resources: {requests: {storage: 2Gi}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: zookeeper}
spec:
  minAvailable: 2
  selector: {matchLabels: {app: zookeeper}}
