{{- if .Values.loadTest.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: load-test
  annotations:
    eks.amazonaws.com/role-arn: {{ index .Values.roleArns "load-test" | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: load-test-{{ .Values.loadTest.runId }}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata: {labels: {app: load-test}}
    spec:
      restartPolicy: Never
      serviceAccountName: load-test
      containers:
        - name: k6
          image: {{ .Values.image | quote }}
          command: ["python", "-m", "s23.loadtest"]
          envFrom: [{configMapRef: {name: s23-environment}}]
          env:
            - {name: SERVICE, value: patient-simulator}
            - {name: LOAD_RATE, value: {{ .Values.loadTest.rate | quote }}}
            - {name: LOAD_DURATION, value: 10m}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
{{- end }}
