apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: observability
  annotations:
    eks.amazonaws.com/role-arn: '{{ index .Values.roleArns "fluent-bit" }}'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: s23-fluent-bit
rules:
  - apiGroups: [""]
    resources: [namespaces, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: s23-fluent-bit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: s23-fluent-bit
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: s23-fluent-bit
  namespace: observability
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush 5
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
    [INPUT]
        Name tail
        Path /var/log/containers/*_s23_*.log
        Tag kube.*
        multiline.parser docker, cri
        Mem_Buf_Limit 10MB
        Skip_Long_Lines Off
    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_Tag_Prefix kube.var.log.containers.
        Merge_Log On
        Keep_Log On
    [OUTPUT]
        Name cloudwatch_logs
        Match kube.*
        region {{ .Values.region }}
        log_group_name {{ .Values.logGroup }}
        log_stream_prefix eks-
        auto_create_group false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: observability
spec:
  selector:
    matchLabels:
      app: fluent-bit
  template:
    metadata:
      labels:
        app: fluent-bit
    spec:
      serviceAccountName: fluent-bit
      containers:
        - name: fluent-bit
          image: public.ecr.aws/aws-observability/aws-for-fluent-bit:stable
          command: ["/fluent-bit/bin/fluent-bit"]
          args: ["-c", "/fluent-bit/etc/s23/fluent-bit.conf"]
          env:
            - name: AWS_REGION
              value: "{{ .Values.region }}"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: logs
              mountPath: /var/log
              readOnly: true
            - name: config
              mountPath: /fluent-bit/etc/s23
              readOnly: true
      volumes:
        - name: logs
          hostPath:
            path: /var/log
        - name: config
          configMap:
            name: s23-fluent-bit