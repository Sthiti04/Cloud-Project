[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "s23-cloud-project"
version = "0.1.0"
description = "Synthetic S23 healthcare monitoring assignment"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["s23*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["repository: offline repository, documentation and rendered-manifest contracts"]

[tool.coverage.run]
branch = true
source = ["s23", "tools"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
files = ["s23", "tools"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "confluent_kafka.*", "kazoo.*", "grpc.*",
          "aws_msk_iam_sasl_signer.*"]
ignore_missing_imports = true
